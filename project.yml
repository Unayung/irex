name: Irex
options:
  bundleIdPrefix: io.github.unayung
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Irex:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      # ponytail: 只放在 Mac 上的 vendor/，由 bin/build 從 ~/build/ghostty 複製；不進版控。
      - framework: vendor/ghostty-vt.xcframework
        embed: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: irex
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
