name: Irex
options:
  bundleIdPrefix: io.github.unayung
  deploymentTarget:
    iOS: "18.0"   # the Live Activity's Apple Watch layout
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Irex:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    entitlements:
      path: Irex.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - target: IrexWidgets
      # ponytail: 只放在 Mac 上的 vendor/，由 bin/build 從 ~/build/ghostty 複製；不進版控。
      - framework: vendor/ghostty-vt.xcframework
        embed: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: irex
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Take a photo to attach to a pane, for the agent in it to see.
        CFBundleURLTypes: [{CFBundleURLName: io.github.unayung.Irex, CFBundleURLSchemes: [irex]}]
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  IrexWidgets:
    # The Live Activity on the lock screen and in the Dynamic Island, and the Agents widget.
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.unayung.Irex.Widgets
    info:
      path: Widgets.plist
      properties:
        CFBundleDisplayName: irex
        # irex-push, for the Agents widget: RELAY in bin/config. (An App Group would let the app tell it,
        # but automatic signing with an API key can't register one.)
        IrexRelay: $(IREX_RELAY)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
